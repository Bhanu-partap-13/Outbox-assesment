services:
  - type: web
    name: outbox-labs
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-labs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: QUEUE_ADMIN_USER
        value: admin
      - key: QUEUE_ADMIN_PASSWORD
        generateValue: true

  - type: worker
    name: outbox-labs-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:generate && npm run build --workspace backend
    startCommand: npm run worker --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: outbox-labs-db
          property: connectionString

databases:
  - name: outbox-labs-db
    plan: free
